name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout MusicEditor
        uses: actions/checkout@v4
        with:
          path: MusicEditor

      - name: Checkout MusicEngine dependency
        uses: actions/checkout@v4
        with:
          repository: watermann420/MusicEngine
          path: MusicEngine

      - name: Install .NET (10.0 preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\NuGet\Cache
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build & Test
        shell: pwsh
        working-directory: MusicEditor
        run: pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Clean -Release

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: MusicEditor/MusicEngineEditor.Tests/TestResults.trx
          if-no-files-found: warn
